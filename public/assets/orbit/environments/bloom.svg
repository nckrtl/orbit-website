<!--
  The tab icon. This is the SMALL artwork: the figure with no margin at all and
  the lanes opened up, on its own dark tile.

  The full mark is `tongue`, which draws a near white margin with the panel
  breaking out across it. At 16 pixels that margin is two pixels of white and
  the crossing it exists for is gone, and a near white tile on a light tab bar
  is barely there at all. So the tab drops the frame exactly the way the app's
  `.icns` drops it below 64. The full mark lives in brand/mark.svg.

  This carries its own dark ground, so it reads the same in a light or a dark
  tab bar and needs no prefers-color-scheme rule.
-->
